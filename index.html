<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniMart · Login & Register</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Manrope', sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            /* Warna latar belakang ungu gelap jika tiada video */
            background: linear-gradient(135deg, #2b194d, #5835a6);
        }
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
        }
        .wrapper {
            width: 420px;
            background: rgba(255, 255, 255, 0.12);
            border: 2px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            padding: 30px 40px;
            color: white;
            margin: 20px;
        }
        .wrapper h1 {
            font-size: 32px;
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .input-box {
            position: relative;
            margin: 16px 0;
        }
        .input-box input {
            width: 100%;
            padding: 12px 40px 12px 16px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            outline: none;
            border-radius: 40px;
            color: white;
            font-size: 14px;
        }
        .input-box input::placeholder {
            color: rgba(255, 255, 255, 0.85);
        }
        .input-box i {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            color: rgba(255, 255, 255, 0.85);
        }
        .input-box select {
            width: 100%;
            padding: 12px 40px 12px 16px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            outline: none;
            border-radius: 40px;
            color: white;
            font-size: 14px;
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
        }
        .input-box select option {
            background: #e5d6ff;
            color: rgb(0, 0, 0);
            padding: 12px 40px 12px 16px;
        }
        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13.5px;
            margin: -5px 0 18px;
        }
        .remember-forgot label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .remember-forgot label input {
            accent-color: #725AC1;
        }
        .btn {
            width: 100%;
            height: 45px;
            border: none;
            outline: none;
            border-radius: 40px;
            background: white;
            color: #333;
            font-weight: 700;
            font-size: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn:hover {
            color: white;
            background: #725AC1;
        }
        .btn:active {
            transform: scale(0.97);
        }
        .register-link,
        .login-link {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
        }
        .register-link a,
        .login-link a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        .register-link a:hover,
        .login-link a:hover {
            text-decoration: underline;
        }
        .d-none {
            display: none !important;
        }
        .alert {
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-top: 14px;
            text-align: center;
        }
        .alert-danger {
            background: rgba(220, 53, 69, 0.85);
            color: #fff;
        }
        .alert-success {
            background: rgba(25, 135, 84, 0.85);
            color: #fff;
        }
        .toggle-pass {
            cursor: pointer;
        }
        .demo-fill {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }
        .demo-btn {
            flex: 1;
            padding: 7px 10px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            background: rgba(255, 255, 255, 0.12);
            color: white;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .demo-btn:hover {
            background: rgba(255, 255, 255, 0.28);
        }
    </style>
</head>
<body data-page="auth">
    <video autoplay muted loop class="video-background"><source src="bg.mp4" type="video/mp4"></video> 

    <div class="wrapper">
        <form id="login-form">
            <h1>UniMart Login</h1>
            <div class="input-box">
                <input type="email" id="login-email" placeholder="Student / Seller Email" required>
                <i class="fas fa-envelope"></i>
            </div>
            <div class="input-box">
                <input type="password" id="login-password" placeholder="Password" required>
                <i class="fas fa-eye toggle-pass" data-toggle-password="login-password" title="Show/Hide Password"></i>
            </div>
            <div class="input-box" id="campus-box">
                <select id="login-campus">
                    <option value="" disabled selected>Select Campus</option>
                    <option value="UiTM Shah Alam">UiTM Shah Alam</option>
                    <option value="UiTM Puncak Perdana">UiTM Puncak Perdana</option>
                    <option value="UiTM Puncak Alam">UiTM Puncak Alam</option>
                </select>
                <i class="fas fa-university"></i>
            </div>
            <div class="demo-fill">
                <button type="button" class="demo-btn" data-fill-email="seller@unimart.edu.my" data-fill-pass="seller123">
                    <i class="fas fa-user-shield"></i> Seller
                </button>
                <button type="button" class="demo-btn" data-fill-email="student@unimart.edu.my" data-fill-pass="student123">
                    <i class="fas fa-user-graduate"></i> Student 
                </button>
            </div>

            <div class="remember-forgot">
                <label><input type="checkbox"> Remember me</label>
            </div>
            <button type="submit" class="btn">Login</button>
            
            <div id="login-error" class="alert alert-danger d-none"></div>

            <div class="register-link">
                <p><a href="#" id="show-register">Don't have an account? Register</a></p>
                <p><a href="home.html">Continue as guest</a></p>
            </div>
        </form>

        <form id="register-form" class="d-none">
            <h1>Create Account</h1>
            <div class="input-box">
                <input type="text" id="register-name" placeholder="Full Name" required>
                <i class="fas fa-user"></i>
            </div>
            <div class="input-box">
                <input type="email" id="register-email" placeholder="Student Email" required>
                <i class="fas fa-envelope"></i>
            </div>
            <div class="input-box">
                <input type="tel" id="register-phone" placeholder="Phone Number (e.g. 0123456789)" required>
                <i class="fas fa-phone"></i>
            </div>
            <div class="input-box">
                <input type="password" id="register-password" placeholder="Password" required>
                <i class="fas fa-eye toggle-pass" data-toggle-password="register-password" title="Show/Hide Password"></i>
            </div>
            <div class="remember-forgot">
                <label><input type="checkbox" id="request-seller"> Request Seller Access (Needs seller Approval)</label>
            </div>
            <button type="submit" class="btn">Register</button>

            <div id="register-message" class="d-none"></div>

            <div class="login-link">
                <p><a href="#" id="show-login">Already have an account? Login</a></p>
            </div>
        </form>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
